# PhantomixOS GRUB Configuration
# Boot menu for the live AI-powered penetration testing ISO
# Target: Intel i5-6th Gen (Skylake), 8GB RAM
#
# Layout follows the standard live-ISO convention (as used by MX Linux and
# Kali): GRUB config at /boot/grub/grub.cfg, payload at /live/.
#
#   /live/vmlinuz                 guest kernel
#   /live/initrd.img              PhantomixOS initramfs (scripts/build-initramfs.sh)
#   /live/filesystem.squashfs     the read-only root
#
# NOTE: there is deliberately NO root=/ or rootfstype= on these lines.
# Our root is a squashfs nested inside the ISO, not a block device, so the
# kernel has no root= to mount -- /init in our initramfs finds the media,
# loop-mounts the squashfs, and switch_roots into it. Passing root= here
# would make the kernel try (and fail) to mount a nonexistent device.

set timeout=10
set default=0

# Color scheme for readability
set color_normal=white/black
set color_highlight=black/cyan

# Banner
echo ""
echo "  ┌────────────────────────────────────────────────┐"
echo "  │  PhantomixOS - AI-Powered Penetration Testing ISO │"
echo "  │  Fully Offline | FOSS | Libre Firmware         │"
echo "  └────────────────────────────────────────────────┘"
echo ""

# --- Main boot entries ---

menuentry "▶  PhantomixOS - Automated Pentest (Recommended)" {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=3 quiet splash
    initrd /live/initrd.img
}

menuentry "  PhantomixOS - Safe Mode (Verbose Boot)" {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=7 nosplash
    initrd /live/initrd.img
}

menuentry "  PhantomixOS - Recovery Shell (No AI)" {
    linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 single
    initrd /live/initrd.img
}

# --- Submenu: tool-specific boot options ---

submenu "Advanced Options" {
    menuentry "Boot with no USB auto-detection" {
        linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 phantomixos.no.usb.detect=1
        initrd /live/initrd.img
    }

    menuentry "Boot with serial console only (no VGA)" {
        linux /live/vmlinuz console=ttyS0,115200n8
        initrd /live/initrd.img
    }

    menuentry "Boot with debug logging (verbose initramfs)" {
        linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 debug break=init
        initrd /live/initrd.img
    }

    menuentry "Boot to emergency shell" {
        linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 break=top
        initrd /live/initrd.img
    }

    menuentry "Boot with USB persistence (bind /skills /results read-write)" {
        linux /live/vmlinuz console=tty0 console=ttyS0,115200n8 phantomixos.persist=1
        initrd /live/initrd.img
    }

    menuentry "Return to main menu" {
        configfile /boot/grub/grub.cfg
    }
}